<title id="title">날씨 추가 전후 세 지표의 직접 비교</title><desc id="desc">P6_clean, 동일 라벨 180,332행과 외부 폴드, 시드 42/1/7. 10분 공개 지연 가정. 세 지표 모두 개선. 값과 차이는 원본 집계에서 각각 반올림. SD는 신뢰구간이 아님.</desc>

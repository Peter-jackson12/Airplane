<title id="title">동일조건 비교에서 세 지표 모두 개선</title><desc id="desc">P6_clean, 같은 180,332행, 시드 42/1/7. Macro F1 0.573910에서 0.598945, LogLoss 0.448116에서 0.436689, ROC-AUC 0.640618에서 0.672936. 변화량은 원본 집계에서 따로 반올림했습니다. 10분 공개 지연은 가정이며 인과 효과와 미래 운항 성능은 미검증입니다.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" role="img" aria-labelledby="title desc">
<title id="title">공개 지연 가정별 날씨 결합률</title><desc id="desc">층화 보정 표본 300행 중 수집 가능 268행. 0/10/30/60분은 미검증 가정. 60분에서 출발 150/268, 도착 157/268. 결합률이며 모델 성능이 아님.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" data-design="technical-launch-h" data-chart-type="horizontal-population-stack">
<title id="title">백만 행 중 날짜를 확인한 집단</title><desc id="desc">서로 겹치지 않는 세 집단. 채택 706,759행, 결측 키 단일 후보 291,308행과 기타 1,933행은 보류.</desc>
<style>text{font-family:"Noto Sans CJK KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-variant-numeric:tabular-nums}</style>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="800.000" y="105.000" font-size="58" fill="#202124" font-weight="500" text-anchor="middle">백만 행 중 날짜를 확인한 집단</text>
<text x="800.000" y="171.000" font-size="30" fill="#5F6368" font-weight="400" text-anchor="middle">원본 1,000,000행 전체를 대조 · 미검사 집단 없음</text>
<text x="120.000" y="269.000" font-size="32" fill="#185ABC" font-weight="600" text-anchor="start">날짜 귀속 채택</text>
<text x="1480.000" y="269.000" font-size="42" fill="#185ABC" font-weight="600" text-anchor="end">706,759행 · 70.68%</text>
<rect x="120.000" y="310.000" width="961.192" height="90.000" fill="#185ABC"/>
<rect x="1081.192" y="310.000" width="396.179" height="90.000" fill="#DADCE0"/>
<rect x="1477.371" y="310.000" width="2.629" height="90.000" fill="#202124"/>
<text x="120.000" y="492.000" font-size="32" fill="#202124" font-weight="400" text-anchor="start">채택 · 완전한 키 + 단일 후보 연도</text>
<text x="1480.000" y="492.000" font-size="38" fill="#185ABC" font-weight="600" text-anchor="end">706,759행</text>
<line x1="120.000" y1="526.000" x2="1480.000" y2="526.000" stroke="#DADCE0" stroke-width="1"/>
<text x="120.000" y="590.000" font-size="32" fill="#202124" font-weight="400" text-anchor="start">보류 · 결측 키 + 단일 후보 연도</text>
<text x="1480.000" y="590.000" font-size="38" fill="#202124" font-weight="600" text-anchor="end">291,308행</text>
<line x1="120.000" y1="624.000" x2="1480.000" y2="624.000" stroke="#DADCE0" stroke-width="1"/>
<text x="120.000" y="688.000" font-size="32" fill="#202124" font-weight="400" text-anchor="start">보류 · 그 밖의 대조 결과</text>
<text x="1480.000" y="688.000" font-size="38" fill="#202124" font-weight="600" text-anchor="end">1,933행</text>
<line x1="120.000" y1="722.000" x2="1480.000" y2="722.000" stroke="#DADCE0" stroke-width="1"/>
<text x="120.000" y="815.000" font-size="30" fill="#5F6368" font-weight="400" text-anchor="start">후보 연도가 하나여도 대조 키가 결측이면 채택하지 않습니다.</text>
<text x="80.000" y="872.000" font-size="28" fill="#5F6368" font-weight="400" text-anchor="start">출처: README의 연결된 원본 집계</text>
<text x="1516.000" y="872.000" font-size="28" fill="#5F6368" font-weight="400" text-anchor="end">날짜 귀속</text>
</svg>

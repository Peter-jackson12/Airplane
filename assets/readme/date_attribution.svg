<title id="title">날짜를 확인한 706,759행만 채택</title><desc id="desc">원본 1,000,000행을 모두 대조했습니다. 세로 누적 막대의 세 집단은 서로 겹치지 않습니다. 채택 706,759행, 결측 키의 단일 후보 연도 291,308행과 그 밖의 1,933행은 보류합니다.</desc>

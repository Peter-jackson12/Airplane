<text x="1134.000" y="906.000" font-size="26" fill="#051766" font-weight="600" text-anchor="start">세 집단 합계 100%</text>
<text x="84.000" y="948.000" font-size="27" fill="#5E5E5E" font-weight="400" text-anchor="start">보류 293,241행도 모두 대조했습니다. 미검사 집단이 아닙니다.</text>
<text x="84.000" y="991.000" font-size="26" fill="#5E5E5E" font-weight="400" text-anchor="start">대조 정보가 빠져 있다면 후보 연도가 하나여도 채택하지 않습니다.</text>
<text x="80.000" y="1032.000" font-size="21" fill="#5E5E5E" font-weight="400" text-anchor="start">정적 교차검증 연구 · 연결된 원본 집계에서 재현</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1350" viewBox="0 0 1600 1350" role="img" aria-labelledby="title desc">
<title id="title">모델 선택은 내부에서, 외부 검증은 최종 채점만</title><desc id="desc">층화 5분할 외부 학습 데이터 안에서 80대20으로 분리. 내부 학습 경계에서 TE를 계산하고 내부 검증으로 트리 수와 임계값을 선택. 외부 검증은 최종 채점 전용.</desc>
<rect width="1600" height="1350" rx="32" fill="#FFF9EF"/>
<rect x="22" y="22" width="1556" height="98" rx="28" fill="#F3E6DD"/>
<text x="78" y="86" fill="#51413D" font-family="sans-serif" font-size="31" font-weight="700">AIRPLANE · CAT PLAYGROUND</text>
<text x="1330" y="84" fill="#77675F" font-family="sans-serif" font-size="25">FIELD NOTES / I</text>
<g transform="translate(0 138)">
<rect width="1600" height="1120" fill="#FFF9EF"/>
<text x="80" y="62" fill="#51413D" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="28" font-weight="700" text-anchor="start" style="font-variant-numeric:tabular-nums">02 / EVALUATION BOUNDARY</text>
<text x="1520" y="62" fill="#72645D" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="28" font-weight="400" text-anchor="end" style="font-variant-numeric:tabular-nums">AIRPLANE / I</text>
<line x1="80" y1="90" x2="1520" y2="90" stroke="#51413D" stroke-width="2"/>
<text x="80" y="178" fill="#51413D" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="64" font-weight="800" text-anchor="start" style="font-variant-numeric:tabular-nums">선택은 안쪽에서, 채점은 바깥에서</text>
<text x="80" y="246" fill="#72645D" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="30" font-weight="400" text-anchor="start" style="font-variant-numeric:tabular-nums">층화 5분할 × 시드 42 / 1 / 7 · 각 조건에서 같은 선택 절차</text>
<rect x="80" y="304" width="928" height="586" fill="#F2E4ED"/>
<text x="112" y="363" fill="#704156" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="32" font-weight="700" text-anchor="start" style="font-variant-numeric:tabular-nums">외부 학습 데이터 안에서만 선택</text>
<text x="112" y="438" fill="#51413D" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="52" font-weight="800" text-anchor="start" style="font-variant-numeric:tabular-nums">01</text>
<text x="240" y="438" fill="#51413D" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="38" font-weight="700" text-anchor="start" style="font-variant-numeric:tabular-nums">내부 학습 / 80%</text>
<text x="240" y="500" fill="#51413D" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="32" font-weight="400" text-anchor="start" style="font-variant-numeric:tabular-nums">학습 경계에서 TE 계산</text>
<text x="240" y="552" fill="#51413D" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="32" font-weight="400" text-anchor="start" style="font-variant-numeric:tabular-nums">트리 수 후보별 모델 학습</text>
<text x="112" y="672" fill="#51413D" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="52" font-weight="800" text-anchor="start" style="font-variant-numeric:tabular-nums">02</text>
<text x="240" y="672" fill="#51413D" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="38" font-weight="700" text-anchor="start" style="font-variant-numeric:tabular-nums">내부 검증 / 20%</text>
<text x="240" y="734" fill="#51413D" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="32" font-weight="400" text-anchor="start" style="font-variant-numeric:tabular-nums">LogLoss → 트리 수</text>
<text x="240" y="786" fill="#51413D" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="32" font-weight="400" text-anchor="start" style="font-variant-numeric:tabular-nums">Macro F1 → 임계값</text>
<line x1="112" y1="590" x2="976" y2="590" stroke="#51413D" stroke-width="2"/>
<line x1="1056" y1="304" x2="1056" y2="890" stroke="#51413D" stroke-width="3"/>
<text x="1100" y="360" fill="#704156" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="28" font-weight="700" text-anchor="start" style="font-variant-numeric:tabular-nums">03 / 최종 채점 전용</text>
<text x="1100" y="468" fill="#51413D" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="48" font-weight="800" text-anchor="start" style="font-variant-numeric:tabular-nums">외부 검증</text>
<text x="1100" y="540" fill="#51413D" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="30" font-weight="700" text-anchor="start" style="font-variant-numeric:tabular-nums">선택에 사용하지 않음</text>
<text x="1100" y="612" fill="#51413D" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="28" font-weight="400" text-anchor="start" style="font-variant-numeric:tabular-nums">각 폴드의 예측 → OOF</text>
<text x="1100" y="676" fill="#51413D" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="30" font-weight="700" text-anchor="start" style="font-variant-numeric:tabular-nums">OOF = 최종 평가</text>
<text x="1100" y="798" fill="#51413D" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="30" font-weight="400" text-anchor="start" style="font-variant-numeric:tabular-nums">선택한 모델 그대로</text>
<text x="1100" y="846" fill="#51413D" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="30" font-weight="400" text-anchor="start" style="font-variant-numeric:tabular-nums">최종 성능을 채점</text>
<text x="80" y="962" fill="#51413D" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="34" font-weight="700" text-anchor="start" style="font-variant-numeric:tabular-nums">외부 검증으로 선택하지 않음</text>
<text x="80" y="1016" fill="#72645D" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="30" font-weight="400" text-anchor="start" style="font-variant-numeric:tabular-nums">각 행을 학습에 쓰지 않은 모델의 예측을 모아 평가합니다.</text>
<text x="80" y="1076" fill="#72645D" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="28" font-weight="400" text-anchor="start" style="font-variant-numeric:tabular-nums">라벨 누수 방지와 미래 시점의 입력 확보 가능성은 서로 다른 문제입니다.</text>
</g>

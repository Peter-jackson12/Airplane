<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="543" viewBox="0 0 1000 543" role="img" aria-labelledby="title desc">
<title id="title">모델 선택과 최종 평가의 경계</title><desc id="desc">층화 5분할 외부 학습 데이터 안에서 다시 80대20으로 분리합니다. 내부 학습 경계에서 타깃 인코딩을 계산하고 내부 검증으로 트리 수와 임계값을 선택한 뒤 외부 검증을 최종 채점에만 사용합니다.</desc>
<style>text{font-family:"Noto Sans CJK KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="1000" height="543" rx="20" fill="#F6F9FA"/>
<text x="36" y="48" font-size="30" fill="#183B4E" font-weight="700">모델을 고르는 데이터와 채점하는 데이터를 분리</text>
<text x="36" y="84" font-size="21" fill="#526878" font-weight="400">층화 5분할 × 시드 42 / 1 / 7 · 각 조건에서 같은 선택 절차</text>
<rect x="36" y="112" width="636" height="310" rx="12" fill="#E8F1F3"/>
<text x="58" y="148" font-size="23" fill="#007E80" font-weight="700">외부 학습 데이터 안에서만 선택</text>
<rect x="56" y="173" width="287" height="164" rx="12" fill="#FFFFFF"/>
<text x="78" y="204" font-size="17" fill="#007E80" font-weight="700">내부 학습 / 80%</text>
<text x="78" y="239" font-size="26" fill="#183B4E" font-weight="700">학습</text>
<text x="78" y="271" font-size="20" fill="#526878" font-weight="400">학습 경계에서 TE 계산</text>
<text x="78" y="300" font-size="20" fill="#526878" font-weight="400">트리 수 후보별 모델 학습</text>
<rect x="365" y="173" width="287" height="164" rx="12" fill="#FFFFFF"/>
<text x="387" y="204" font-size="17" fill="#007E80" font-weight="700">내부 검증 / 20%</text>
<text x="387" y="239" font-size="26" fill="#183B4E" font-weight="700">선택</text>
<text x="387" y="271" font-size="20" fill="#526878" font-weight="400">LogLoss → 트리 수</text>
<text x="387" y="300" font-size="20" fill="#526878" font-weight="400">Macro F1 → 임계값</text>
<path d="M345 246 H360" fill="none" stroke="#007E80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="58" y="389" font-size="20" fill="#526878" font-weight="400">선택한 모델 그대로 평가 · 외부 검증으로 선택하지 않음</text>
<rect x="701" y="112" width="263" height="310" rx="12" fill="#102D40"/>
<text x="723" y="143" font-size="17" fill="#8EDDD1" font-weight="700">최종 채점 전용</text>
<text x="723" y="178" font-size="26" fill="#FFFFFF" font-weight="700">외부 검증</text>
<text x="723" y="210" font-size="20" fill="#D4E4EC" font-weight="400">선택에 사용하지 않음</text>
<text x="723" y="239" font-size="20" fill="#D4E4EC" font-weight="400">각 폴드의 예측 → OOF</text>
<path d="M672 267 H696" fill="none" stroke="#007E80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="36" y="469" font-size="23" fill="#183B4E" font-weight="500">OOF: 각 행을 학습에 쓰지 않은 모델의 예측을 모아 평가</text>
<text x="36" y="510" font-size="21" fill="#526878" font-weight="400">라벨 누수 방지와 미래 시점의 입력 확보 가능성은 서로 다른 문제입니다.</text>
</svg>

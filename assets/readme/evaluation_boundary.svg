<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">선택과 채점의 분리를 보이는 평가 명세</title><desc id="desc">층화 5분할. 외부 학습 안에서 내부 학습 80%, 내부 검증 20%. 내부 학습 경계에서 TE 계산, 내부 검증에서 트리 수·임계값 선택. 외부 검증은 최종 채점 전용.</desc>
<rect width="1600" height="960" fill="#FFFFFF"/>
<rect x="64" y="42" width="54" height="42" fill="#A72E20"/>
<text x="91" y="72" fill="#FFFFFF" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="23" font-weight="700" text-anchor="middle" style="font-variant-numeric:tabular-nums">02</text>
<text x="140" y="72" fill="#222526" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="23" font-weight="700" text-anchor="start" style="font-variant-numeric:tabular-nums">METHOD / 평가의 경계</text>
<text x="1536" y="72" fill="#595F63" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="400" text-anchor="end" style="font-variant-numeric:tabular-nums" letter-spacing="1">AIRPLANE / EVIDENCE BRIEF</text>
<line x1="64" y1="104" x2="1536" y2="104" stroke="#222526" stroke-width="2"/>
<text x="65" y="191" fill="#222526" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="55" font-weight="800" text-anchor="start" style="font-variant-numeric:tabular-nums">모델 선택과 최종 채점은 분리합니다</text>
<text x="65" y="246" fill="#595F63" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="28" font-weight="400" text-anchor="start" style="font-variant-numeric:tabular-nums">층화 5분할 × 시드 42 / 1 / 7 · 각 조건에 같은 선택 절차 적용</text>
<rect x="65" y="290" width="920" height="54" fill="#222526"/>
<text x="92" y="328" fill="#FFFFFF" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="27" font-weight="700" text-anchor="start" style="font-variant-numeric:tabular-nums">외부 학습 데이터 안에서만 선택</text>
<rect x="65" y="378" width="920" height="163" fill="#F2F3F3"/>
<text x="95" y="457" fill="#A72E20" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="65" font-weight="800" text-anchor="start" style="font-variant-numeric:tabular-nums">1</text>
<text x="230" y="427" fill="#222526" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="30" font-weight="700" text-anchor="start" style="font-variant-numeric:tabular-nums">내부 학습 / 80%</text>
<text x="230" y="477" fill="#222526" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="28" font-weight="400" text-anchor="start" style="font-variant-numeric:tabular-nums">학습 경계에서 TE 계산</text>
<text x="620" y="477" fill="#222526" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="25" font-weight="400" text-anchor="start" style="font-variant-numeric:tabular-nums">트리 수 후보별 모델 학습</text>
<rect x="65" y="570" width="920" height="163" fill="#F2F3F3"/>
<text x="95" y="649" fill="#A72E20" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="65" font-weight="800" text-anchor="start" style="font-variant-numeric:tabular-nums">2</text>
<text x="230" y="619" fill="#222526" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="30" font-weight="700" text-anchor="start" style="font-variant-numeric:tabular-nums">내부 검증 / 20%</text>
<text x="230" y="669" fill="#222526" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="28" font-weight="400" text-anchor="start" style="font-variant-numeric:tabular-nums">LogLoss → 트리 수 선택</text>
<text x="620" y="669" fill="#222526" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="25" font-weight="400" text-anchor="start" style="font-variant-numeric:tabular-nums">Macro F1 → 임계값 선택</text>
<line x1="1040" y1="290" x2="1040" y2="734" stroke="#A72E20" stroke-width="4"/>
<rect x="1095" y="290" width="440" height="54" fill="#A72E20"/>
<text x="1124" y="328" fill="#FFFFFF" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="27" font-weight="700" text-anchor="start" style="font-variant-numeric:tabular-nums">최종 채점 전용</text>
<text x="1124" y="433" fill="#A72E20" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="65" font-weight="800" text-anchor="start" style="font-variant-numeric:tabular-nums">3</text>
<text x="1124" y="494" fill="#222526" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="39" font-weight="800" text-anchor="start" style="font-variant-numeric:tabular-nums">외부 검증</text>
<text x="1124" y="551" fill="#222526" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="27" font-weight="400" text-anchor="start" style="font-variant-numeric:tabular-nums">선택에 사용하지 않음</text>
<text x="1124" y="605" fill="#222526" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="25" font-weight="400" text-anchor="start" style="font-variant-numeric:tabular-nums">각 폴드의 예측 → OOF</text>
<text x="1124" y="660" fill="#222526" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="28" font-weight="700" text-anchor="start" style="font-variant-numeric:tabular-nums">OOF = 최종 평가</text>
<line x1="65" y1="783" x2="1535" y2="783" stroke="#222526" stroke-width="2"/>
<text x="65" y="835" fill="#A72E20" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="31" font-weight="700" text-anchor="start" style="font-variant-numeric:tabular-nums">외부 검증으로 선택하지 않음</text>
<text x="65" y="886" fill="#222526" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="27" font-weight="400" text-anchor="start" style="font-variant-numeric:tabular-nums">각 행을 학습에 쓰지 않은 모델의 예측을 모아 평가합니다.</text>
<text x="65" y="935" fill="#595F63" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="25" font-weight="400" text-anchor="start" style="font-variant-numeric:tabular-nums">라벨 누수 방지와 미래 시점의 입력 확보 가능성은 서로 다른 문제입니다.</text>
</svg>

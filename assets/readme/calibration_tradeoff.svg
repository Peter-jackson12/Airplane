<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1210" viewBox="0 0 1600 1210" role="img" aria-labelledby="title desc" data-design="korean-air-palette-d" data-chart-type="aligned-independent-calibration-panels">
<title id="title">확률 보정은 지표마다 다른 방향</title><desc id="desc">P6_clean 공유형 보정기, 라벨 255,001행의 3시드 평균. ECE는 %p, LogLoss는 독립 확대 축이며 모두 낮을수록 좋습니다. Isotonic은 ECE가 낮아졌지만 LogLoss는 높아졌고 Macro F1 향상은 확인되지 않았습니다.</desc>

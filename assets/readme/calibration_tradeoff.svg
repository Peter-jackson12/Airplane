<title id="title">확률 보정의 상충 관계: ECE와 LogLoss</title><desc id="desc">P6_clean 공유형 보정기, 라벨 255,001행의 3시드 평균. ECE는 %p, LogLoss와 모두 낮을수록 좋음.</desc>

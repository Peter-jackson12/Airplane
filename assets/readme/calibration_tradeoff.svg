<text x="32.000" y="77.000" font-size="18" fill="#52647A" font-weight="400" text-anchor="start">P6_clean · 공유형 보정기 · 라벨 255,001행 · 3시드 평균</text>
<text x="32.000" y="105.000" font-size="17" fill="#52647A" font-weight="400" text-anchor="start">Isotonic은 ECE가 낮아졌지만 LogLoss는 높아짐</text>

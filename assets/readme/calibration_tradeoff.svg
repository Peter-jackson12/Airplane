<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc" data-design="technical-launch-h" data-chart-type="calibration-tradeoff-scorecard">
<title id="title">확률 보정은 지연 탐지 개선과 같지 않습니다</title><desc id="desc">P6_clean 공유형 전체 라벨 255,001행. ECE는 비율을 100배 한 %p. 3시드 평균. ECE와 LogLoss는 낮을수록 좋습니다.</desc>
<style>text{font-family:"Noto Sans CJK KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-variant-numeric:tabular-nums}</style>
<rect width="1600" height="1000" fill="#FFFFFF"/>
<text x="800.000" y="105.000" font-size="58" fill="#202124" font-weight="500" text-anchor="middle">확률의 정확성과 지연 탐지 능력은 달랐습니다</text>
<text x="800.000" y="171.000" font-size="30" fill="#5F6368" font-weight="400" text-anchor="middle">P6_clean · 공유형 · 전체 라벨 255,001행 · 3시드 평균</text>
<rect x="80.000" y="250.000" width="1440.000" height="100.000" fill="#E8F0FE"/>
<text x="120.000" y="310.000" font-size="32" fill="#185ABC" font-weight="600" text-anchor="start">보정 방법</text>
<text x="760.000" y="310.000" font-size="32" fill="#185ABC" font-weight="600" text-anchor="end">ECE (%p) ↓</text>
<text x="1130.000" y="310.000" font-size="32" fill="#185ABC" font-weight="600" text-anchor="end">LogLoss ↓</text>
<text x="1480.000" y="310.000" font-size="32" fill="#185ABC" font-weight="600" text-anchor="end">Macro F1 ↑</text>
<text x="120.000" y="444.000" font-size="36" fill="#202124" font-weight="600" text-anchor="start">보정 없음</text>
<text x="760.000" y="444.000" font-size="38" fill="#202124" font-weight="400" text-anchor="end">0.4588</text>
<text x="1130.000" y="444.000" font-size="38" fill="#202124" font-weight="400" text-anchor="end">0.447577</text>
<text x="1480.000" y="444.000" font-size="38" fill="#202124" font-weight="400" text-anchor="end">0.575685</text>
<line x1="120.000" y1="492.000" x2="1480.000" y2="492.000" stroke="#DADCE0" stroke-width="1"/>
<text x="120.000" y="578.000" font-size="36" fill="#202124" font-weight="600" text-anchor="start">Platt</text>
<text x="760.000" y="578.000" font-size="38" fill="#202124" font-weight="400" text-anchor="end">0.3477</text>
<text x="1130.000" y="578.000" font-size="38" fill="#202124" font-weight="400" text-anchor="end">0.447519</text>
<text x="1480.000" y="578.000" font-size="38" fill="#202124" font-weight="400" text-anchor="end">0.575517</text>
<line x1="120.000" y1="626.000" x2="1480.000" y2="626.000" stroke="#DADCE0" stroke-width="1"/>
<text x="120.000" y="712.000" font-size="36" fill="#202124" font-weight="600" text-anchor="start">Isotonic</text>
<text x="760.000" y="712.000" font-size="38" fill="#202124" font-weight="400" text-anchor="end">0.1877</text>
<text x="1130.000" y="712.000" font-size="38" fill="#202124" font-weight="400" text-anchor="end">0.448937</text>
<text x="1480.000" y="712.000" font-size="38" fill="#202124" font-weight="400" text-anchor="end">0.575248</text>
<line x1="120.000" y1="760.000" x2="1480.000" y2="760.000" stroke="#DADCE0" stroke-width="1"/>
<text x="120.000" y="844.000" font-size="30" fill="#5F6368" font-weight="400" text-anchor="start">ECE와 LogLoss는 낮을수록 좋음 · Macro F1은 높을수록 좋음</text>
<text x="120.000" y="910.000" font-size="30" fill="#5F6368" font-weight="400" text-anchor="start">보정이 일부 확률 지표를 바꿨지만 Macro F1 향상은 확인되지 않았습니다.</text>
<text x="80.000" y="972.000" font-size="28" fill="#5F6368" font-weight="400" text-anchor="start">출처: README의 연결된 원본 집계</text>
<text x="1516.000" y="972.000" font-size="28" fill="#5F6368" font-weight="400" text-anchor="end">확률 보정</text>
</svg>

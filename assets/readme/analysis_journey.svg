<text x="80" y="244" fill="#72645D" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="30" font-weight="400" text-anchor="start" style="font-variant-numeric:tabular-nums">출발점: 원본 1,000,000행 · 숫자를 이어 성능 변화로 읽지 않습니다</text>

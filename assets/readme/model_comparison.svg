<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1070" viewBox="0 0 1600 1070" role="img" aria-labelledby="title desc" data-design="technical-launch-h" data-chart-type="highlighted-benchmark-table">
<title id="title">전처리 타당성과 성능 변화는 다릅니다</title><desc id="desc">동일 라벨 255,001행. 네 기준 조건의 Macro F1 평균과 SD. P6_clean 강조는 우승 표기가 아닙니다.</desc>
<style>text{font-family:"Noto Sans CJK KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-variant-numeric:tabular-nums}</style>
<rect width="1600" height="1070" fill="#FFFFFF"/>
<text x="800.000" y="105.000" font-size="58" fill="#202124" font-weight="500" text-anchor="middle">전처리 타당성과 성능 변화는 다릅니다</text>
<text x="800.000" y="171.000" font-size="30" fill="#5F6368" font-weight="400" text-anchor="middle">동일 라벨 255,001행 · 전체 10조건 중 네 기준 조건 · 3시드 평균</text>

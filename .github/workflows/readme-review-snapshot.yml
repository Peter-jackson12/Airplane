name: README review source snapshot

on:
  push:
    branches: [docs/readme-final-reader-review]
    paths: [.github/workflows/readme-review-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Export tracked source for offline documentation review
        run: git archive --format=tar HEAD > readme-review-source.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: readme-review-source
          path: readme-review-source.tar
          retention-days: 1

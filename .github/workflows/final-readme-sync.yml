name: One-shot README figure regeneration
on:
  push:
    branches: [docs/final-submission-weather-results]
    paths: [.github/workflows/final-readme-sync.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/final-submission-weather-results
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.5"
          python-version: "3.14"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Rebuild README figures from tracked evidence
        run: uv run --locked --offline python scripts/build_readme_assets.py
      - name: Verify README presentation contracts
        run: uv run --locked --offline python -m pytest -q tests/test_readme_contract.py tests/test_readme_presentation.py
      - name: Commit generated assets and remove one-shot workflow
        run: |
          rm .github/workflows/final-readme-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/readme/*.svg assets/readme/sources.json .github/workflows/final-readme-sync.yml
          git diff --cached --check
          git commit -m "docs: regenerate final README evidence figures"
          git push origin HEAD:docs/final-submission-weather-results

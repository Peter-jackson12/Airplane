name: README review apply and verify

on:
  push:
    branches: [docs/readme-final-reader-20260922]
    paths: [.github/workflows/readme-review-artifact.yml]

permissions:
  contents: write

jobs:
  apply-reviewed-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Apply only the five reviewed UTF-8 edits
        run: |
          python - <<'PY'
          import gzip, hashlib, json, subprocess
          from pathlib import Path
          digest = lambda b: hashlib.sha256(b).hexdigest()
          text_paths = {'README.md', 'scripts/build_readme_assets.py', 'tests/test_readme_contract.py', 'tests/test_readme_presentation.py', 'tests/test_final_submission_status.py'}
          assets = {'assets/readme/' + p for p in ('date_attribution.svg', 'model_comparison.svg', 'weather_model_comparison.svg', 'calibration_tradeoff.svg', 'weather_latency.svg', 'sources.json')}
          allowed = text_paths | assets
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          baseline = {p: digest(Path(p).read_bytes()) for p in tracked if p and p not in allowed}
          Path('/tmp/readme-review-baseline.json').write_text(json.dumps(baseline))
          payload = gzip.decompress(b''.join(Path(f'.github/readme-review-edits/part-{i}.gzpart').read_bytes() for i in range(4)))
          assert digest(payload) == '033bbe524b7b2e9108672a6b4bb8c36c91927de5c8d09eabd92c7e95129b7eb8', 'Edit recipe checksum mismatch'
          recipe = json.loads(payload)
          assert set(recipe) == text_paths, 'Unexpected edit target'
          replacements = {}
          for name, spec in recipe.items():
              original = Path(name).read_bytes()
              assert digest(original) == spec['before'], f'Source changed: {name}'
              old = original.decode('utf-8')
              parts = []
              for piece in spec['pieces']:
                  if isinstance(piece, str):
                      parts.append(piece)
                  else:
                      assert isinstance(piece, list) and len(piece) == 2
                      a, b = piece
                      assert type(a) is int and type(b) is int and 0 <= a <= b <= len(old)
                      parts.append(old[a:b])
              result = ''.join(parts).encode('utf-8')
              assert digest(result) == spec['after'], f'Reviewed result mismatch: {name}'
              replacements[name] = result
          for name, result in replacements.items():
              Path(name).write_bytes(result)
          print('Applied five exact reviewed files; original evidence has not been edited.')
          PY
      - name: Set up locked environment
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.5'
          python-version: '3.14'
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Rebuild evidence-backed SVGs without training or collection
        run: |
          uv run --locked --offline python scripts/build_readme_assets.py
          uv run --locked --offline python scripts/build_readme_assets.py --check
      - name: Verify reviewed file bytes and unchanged evidence
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          expected = {
              'README.md': '6d3be9e0479b3057954ce2f506ebddb9b60fc3c2a9bec6c0ce605ee3bece05fa',
              'scripts/build_readme_assets.py': '9250144a07b56c95164583d2864729e47dc3a03aff5500b8b3e0a95dfcf92813',
              'tests/test_readme_contract.py': 'b21458f12daa319c5d6c42ccd5d3218f30354aa53f7894622533f2d6981b35ec',
              'tests/test_readme_presentation.py': '9b54ad7e1b58619a5e902273873f0082d9ba436bd69926507b5b0b15338f73c8',
              'tests/test_final_submission_status.py': 'e4f078b151fa77147279f8177ebf4c7f4017bb8de79ad31c00e1a25481d2d7be',
              'assets/readme/calibration_tradeoff.svg': '2b37db95938314c0895e0b961003bcae1df4e54c4b32f09ed6d06765d1dd3ed3',
              'assets/readme/date_attribution.svg': '9bc0f22e2dd6cd2296fe03f1fc75ebe049942a176ca279fe6e118aef338da191',
              'assets/readme/model_comparison.svg': 'e95d7e31d8f7a4554ad93040d1f458fbc1345e4a88e61df55176d2176b3c621d',
              'assets/readme/sources.json': 'f5252e14a305609a4a050c818cd65c1521c0c8e27d627952df9e594181f2f831',
              'assets/readme/weather_latency.svg': '7db7d2f23db18114e731fcb63f68c51fd200e194f06364aae0d1bee7baf58d5a',
              'assets/readme/weather_model_comparison.svg': '4a81fdb79982b4f8e91855c9f325b266338a99f43d52a060d0320e18b2abc0c3',
          }
          digest = lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          for path, sha in expected.items():
              assert digest(path) == sha, f'Not the reviewed file: {path}'
          baseline = json.loads(Path('/tmp/readme-review-baseline.json').read_text())
          for path, sha in baseline.items():
              assert digest(path) == sha, f'Unexpected original-file change: {path}'
          changed = set(subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines())
          assert changed == set(expected), f'Unexpected changed files: {changed ^ set(expected)}'
          print('Verified all 11 reviewed files and all other tracked files unchanged, including output evidence.')
          PY
      - name: Run Git-only regression tests
        run: uv run --locked --offline python -m pytest -q --strict-markers -m 'not local_data'
      - name: Commit verified documentation to the requested working branch
        run: |
          git fetch origin docs/readme-final-reader-20260922
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md scripts/build_readme_assets.py tests/test_readme_contract.py tests/test_readme_presentation.py tests/test_final_submission_status.py assets/readme
          git diff --cached --stat
          git commit -m 'docs: polish Korean final README and evidence-backed figures'
          git push origin HEAD:docs/readme-final-reader-20260922
          git rev-parse HEAD
